<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Segoe UI,Arial;background:transparent}
.card{height:100%;display:grid;place-items:center;background:linear-gradient(145deg,#073b31,#11614f 58%,#0b2f28);color:white;border:1px solid rgba(255,255,255,.22);border-radius:24px;box-sizing:border-box;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.inner{text-align:center;padding:28px}.logo{width:142px;height:142px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.35));border-radius:28px}.title{font-weight:750;font-size:25px;line-height:1.15;margin-top:16px}.sub{color:#e8d8a7;margin-top:9px;font-size:14px}.loader{width:240px;height:5px;background:rgba(255,255,255,.16);border-radius:10px;margin:24px auto 0;overflow:hidden}.loader:after{content:"";display:block;height:100%;width:38%;background:#d5b65d;border-radius:10px;animation:m 1.25s infinite ease-in-out}@keyframes m{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}</style></head><body><div class="card"><div class="inner"><img class="logo" src="../../assets/app.png"><div class="title">Vintage &amp; Classic Vehicle Records</div><div class="sub">Collector Edition · Version 7.1</div><div class="loader"></div></div></div></body></html>
