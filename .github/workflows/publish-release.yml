name: Publish Version 7.2 GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must be v7.2.0)
        required: true
        default: v7.2.0

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
      - run: npm run check
      - name: Verify release tag matches app version
        env:
          TAG: ${{ github.event.inputs.tag }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:TAG -ne "v$version") { throw "Release tag must be v$version; received $env:TAG." }
      - name: Build setup EXE
        run: npm run build:setup
      - name: Generate free GitHub artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'release/installer/*.exe'

      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        shell: pwsh
        run: |
          gh release create $env:TAG release/installer/*.exe release/installer/*.exe.blockmap release/installer/latest.yml --repo $env:GITHUB_REPOSITORY --title "Vintage & Classic Vehicle Records Collector Edition $env:TAG" --generate-notes
